<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skycast — Weather Forecast</title>
  <meta name="description" content="Skycast is a fast, responsive weather app with city search, hourly and 7-day forecasts. Built with vanilla JavaScript and the free Open-Meteo API — no API key needed." />
  <meta property="og:title" content="Skycast — Weather Forecast" />
  <meta property="og:description" content="Live weather, hourly and 7-day forecasts for any city. Vanilla JS + Open-Meteo." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%85%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-overcast-night">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Skycast home">
      <span class="brand-mark" aria-hidden="true">⛅</span>
      <span class="brand-name">Sky<span class="brand-accent">cast</span></span>
    </a>
    <div class="controls">
      <div class="unit-toggle" role="group" aria-label="Temperature unit">
        <button id="btn-c" class="unit-btn" type="button" aria-pressed="true">°C</button>
        <button id="btn-f" class="unit-btn" type="button" aria-pressed="false">°F</button>
      </div>
      <button id="btn-locate" class="icon-btn" type="button" title="Use my location" aria-label="Use my current location">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="7"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
          <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
    </div>
  </header>

  <main id="main" class="wrap">
    <form id="search-form" class="search" role="search" autocomplete="off">
      <label class="search-label" for="search-input">Find a city</label>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <input id="search-input" type="text" placeholder="Search any city… e.g. Islamabad" role="combobox"
               aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list"
               aria-label="Search for a city" />
        <button type="submit" class="search-btn">Search</button>
      </div>
      <div id="suggestions" class="suggestions" role="listbox" aria-label="City suggestions" hidden></div>
    </form>

    <div id="recents" class="recents" aria-label="Recent searches" hidden></div>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <section id="app" class="app" hidden>
      <section class="card hero" aria-label="Current weather">
        <div class="hero-left">
          <h1 id="place-name" class="place"></h1>
          <p id="place-meta" class="place-meta"></p>
          <p id="local-date" class="local-date"></p>
          <p class="temp-now"><span id="temp-value"></span><span class="temp-unit" id="temp-unit"></span></p>
          <p id="cond-text" class="cond-text"></p>
          <p id="feels-like" class="feels"></p>
        </div>
        <div class="hero-right" id="hero-icon" aria-hidden="true"></div>
      </section>

      <section class="card">
        <h2 class="card-title">Details</h2>
        <div id="details" class="details-grid"></div>
      </section>

      <section class="card">
        <h2 class="card-title">Next 24 hours</h2>
        <div id="hourly" class="hourly" role="list"></div>
      </section>

      <section class="card">
        <h2 class="card-title">7-day forecast</h2>
        <div id="daily" class="daily" role="list"></div>
      </section>
    </section>

    <footer class="footer">
      <p>
        Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> (CC BY 4.0)
        · Built by <a href="https://github.com/MuhammadAwais047" target="_blank" rel="noopener noreferrer">Muhammad Awais</a>
      </p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
